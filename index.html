<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mizan">
<meta name="theme-color" id="themeColor" content="#F7F5F0">
<meta name="description" content="Salah, dhikr, body, mind and work. Small, steady deeds, kept in balance.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/funnel-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<title>Mizan</title>
<script>var t='light';try{t=localStorage.getItem('mizan.theme')||'light'}catch(e){}document.documentElement.dataset.theme=t</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="app">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-dhikr" hidden></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-you" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections" hidden>
  <div class="rail-brand"></div>
  <button class="tab" data-tab="today" data-label="Today"></button>
  <button class="tab" data-tab="dhikr" data-label="Dhikr"></button>
  <button class="tab" data-tab="progress" data-label="Progress"></button>
  <button class="tab" data-tab="you" data-label="You"></button>
</nav>

<input type="file" id="file" accept="application/json,.json" hidden>

<script src="quran.js"></script>
<script src="foods.js"></script>
<script src="data.js"></script>
<script src="prayer.js"></script>
<script src="app.js"></script>
</body>
</html>
